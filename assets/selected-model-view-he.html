<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>חדר הדוד — תצוגה מקדימה לאישור</title><style>
  :root {
    --ink: #153149; --muted: #577086; --line: #d5dee6; --bg: #f3f5f7; --card: #ffffffee;
    --hot: #d7463e; --ret: #167abb; --fill: #008c84; --chem: #8850bc; --drain: #b47a12; --signal: #85919e;
    --product: #6b3a1f; --warn: #b8322a; --ls: 1;
    font-family: "Arial Hebrew", "Noto Sans Hebrew", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  header { position: absolute; inset: 0 0 auto 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px;
    align-items: center; justify-content: space-between; padding: 10px 16px; background: #ffffffd9;
    border-bottom: 1px solid var(--line); backdrop-filter: blur(4px); }
  header h1 { margin: 0; font-size: 18px; line-height: 1.25; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid #e3c98b; background: #fff7e3; color: #7d5a10; }
  .badge.stop { border-color: #f0b8b3; background: #fff0ef; color: var(--warn); }
  .toolbar { position: absolute; z-index: 5; top: 74px; right: 12px; display: flex; flex-direction: column; gap: 6px; max-width: 240px; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .group h3 { margin: 0 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  button { font: inherit; font-size: 13px; text-align: right; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; }
  button:hover { border-color: #9fb3c4; }
  button.on { background: #e8f1f8; border-color: #7fa6c6; font-weight: 600; }
  button.tg::before { content: "☐ "; } button.tg.on::before { content: "☑ "; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .leaders { position: absolute; inset: 0; overflow: visible; }
  .ln { stroke: #5f7184; opacity: .85; } .dt { fill: #fff; stroke: #33475a; }
  .lbl { position: absolute; display: none; max-width: calc(300px * var(--ls)); padding: calc(4px * var(--ls)) calc(8px * var(--ls));
    background: #fffffff2; border: 1px solid #c9d5df; border-right: calc(4px * var(--ls)) solid var(--ink); border-radius: calc(6px * var(--ls));
    font-size: calc(12.5px * var(--ls)); line-height: 1.3; color: var(--ink); box-shadow: 0 1px 3px #0b20331a; white-space: normal; }
  .lbl b { display: block; font-weight: 700; }
  .lbl span { display: block; font-size: calc(11px * var(--ls)); color: var(--muted); font-weight: 400; }
  .c-hot { border-right-color: var(--hot) !important; } .c-ret { border-right-color: var(--ret) !important; }
  .c-fill { border-right-color: var(--fill) !important; } .c-chem { border-right-color: var(--chem) !important; }
  .c-drain { border-right-color: var(--drain) !important; } .c-signal { border-right-color: var(--signal) !important; }
  .c-product { border-right-color: var(--product) !important; } .c-note { border-right-color: #9aabbb !important; }
  .c-warn { border-right-color: var(--warn) !important; background: #fff6f5; } .lbl.c-warn b { color: var(--warn); }
  .ln.c-hot { stroke: var(--hot); } .ln.c-ret { stroke: var(--ret); } .ln.c-fill { stroke: var(--fill); }
  .ln.c-chem { stroke: var(--chem); } .ln.c-drain { stroke: var(--drain); } .ln.c-warn { stroke: var(--warn); }
  .ln.c-product { stroke: var(--product); }
  .legend { position: absolute; z-index: 5; bottom: 12px; right: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: calc(8px * var(--ls)) calc(12px * var(--ls)); font-size: calc(12.5px * var(--ls)); display: grid;
    grid-template-columns: auto auto; gap: calc(3px * var(--ls)) calc(18px * var(--ls)); }
  .legend .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .legend i { display: inline-block; width: calc(26px * var(--ls)); height: calc(6px * var(--ls)); border-radius: 3px; }
  .legend i.dash { height: 0; border-top: calc(3px * var(--ls)) dashed var(--signal); border-radius: 0; }
  .legend .full { grid-column: 1 / -1; color: var(--muted); font-size: calc(11px * var(--ls)); }
  .info { position: absolute; z-index: 5; bottom: 12px; left: 12px; max-width: 420px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 12.5px; line-height: 1.45; }
  .info summary { cursor: pointer; font-weight: 700; }
  .info ul { margin: 6px 0 0; padding-inline-start: 18px; }
  .help { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  #err { display: none; position: absolute; inset: 40% 20% auto 20%; z-index: 9; padding: 16px; background: #fff0ef; border: 1px solid #f0b8b3; border-radius: 10px; }
  .titlebox, .stamp { display: none; }
  body.capture header, body.capture .toolbar, body.capture .info, body.capture .legend { display: none; }
  .lmini { display: flex; flex-wrap: wrap; gap: calc(4px * var(--ls)) calc(14px * var(--ls)); margin-top: calc(8px * var(--ls)); font-size: calc(12.5px * var(--ls)); }
  .lmini span { display: inline-flex; align-items: center; gap: calc(6px * var(--ls)); white-space: nowrap; }
  .lmini i { display: inline-block; width: calc(22px * var(--ls)); height: calc(6px * var(--ls)); border-radius: 3px; }
  .lmini i.dash { height: 0; border-top: calc(3px * var(--ls)) dashed var(--signal); border-radius: 0; }
  .lmini em { font-style: normal; color: var(--muted); font-size: calc(11px * var(--ls)); flex-basis: 100%; }
  body.capture .titlebox { display: block; position: absolute; z-index: 5; top: calc(18px * var(--ls)); right: calc(22px * var(--ls));
    background: var(--card); border: 1px solid var(--line); border-radius: calc(10px * var(--ls)); padding: calc(10px * var(--ls)) calc(16px * var(--ls)); }
  .titlebox h2 { margin: 0; font-size: calc(20px * var(--ls)); } .titlebox p { margin: calc(3px * var(--ls)) 0 0; font-size: calc(13px * var(--ls)); color: var(--muted); }
  body.capture .stamp { display: block; position: absolute; z-index: 5; bottom: calc(14px * var(--ls)); left: calc(18px * var(--ls));
    font-size: calc(12.5px * var(--ls)); color: var(--warn); background: #fff6f5; border: 1px solid #f0b8b3; border-radius: calc(8px * var(--ls));
    padding: calc(6px * var(--ls)) calc(12px * var(--ls)); line-height: 1.4; }
  @media (max-width: 760px) {
    header h1 { font-size: 15px; } header p { display: none; }
    .toolbar { top: auto; bottom: 12px; right: 12px; left: 12px; max-width: none; flex-direction: row; overflow-x: auto; }
    .group { flex-direction: row; flex-shrink: 0; } .group h3 { display: none; }
    .legend, .info { display: none; }
  }
